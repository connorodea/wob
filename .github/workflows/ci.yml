name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet -e .

      - name: schema + unit tests (no network)
        run: python -m unittest discover -s tests -v

      - name: data-integrity harness (no network)
        run: |
          mkdir -p data
          python scripts/wob_verify.py